skill_id: native_skill_finder
name: Native Skill Finder
description: Search reviewed local native skill manifests, feature tracking docs, and candidate matrix records for requested capabilities.
category: productivity
version: "1.0.0"
status: available
maturity_level: "4 Tested"
root_id: project_skills
source: project
provenance:
  source_type: native
  review_status: reviewed_local
risk_level: LOW
trust_level: UNTRUSTED_DOCUMENT
allowed_tools:
